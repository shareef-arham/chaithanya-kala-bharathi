<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Members — CKB</title>
  <meta name="description" content="The Executive Committee of Chaithanya Kala Bharathi — who governs the organisation." />
  <link rel="icon" href="assets/logo-sm.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=14" />
</head>
<body data-page="about">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Home</a> / <a href="about.html">About Us</a> / <span>Board Members</span></div>
        <span class="eyebrow">Governance</span>
        <h1>Board members</h1>
        <p class="lede" style="margin-top:.7rem" id="pIntro"></p>
      </div>
    </section>

    <section style="padding-top:1.4rem">
      <div class="wrap">
        <div class="people" id="people" data-reveal></div>
      </div>
    </section>

    <section style="padding-top:0">
      <div class="wrap">
        <div class="about-nav" id="aboutNav" data-reveal></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/site.js?v=11"></script>
  <script>
  (function () {
    var esc = window.CKB_esc;
    function initials(n) {
      var parts = String(n || "").replace(/[^A-Za-z ]/g, " ").trim().split(/\s+/);
      return ((parts[0] || "")[0] || "") + ((parts[parts.length - 1] || "")[0] || "");
    }
    /* A bare filename is an upload; anything with a slash is used as given. */
    function photoURL(p) { return /[\/:]/.test(p) ? p : "uploads/" + encodeURIComponent(p); }
    /* The photo, or the member's initials until one has been added. If a
       photo fails to load, the initials take its place rather than a broken
       image icon. */
    window.CKB_noPhoto = function (img) {
      var box = img.parentNode;
      box.classList.remove("has-photo");
      box.textContent = box.getAttribute("data-ini");
    };
    function portrait(m) {
      var ini = esc(initials(m.name).toUpperCase());
      if (!m.photo) return '<div class="avatar">' + ini + "</div>";
      return '<div class="avatar has-photo" data-ini="' + ini + '">' +
        '<img src="' + esc(photoURL(m.photo)) + '" alt="' + esc(m.name) + '" loading="lazy" ' +
        'onerror="CKB_noPhoto(this)">' +
        "</div>";
    }
    CKB_get("about.json").then(function (d) {
      var b = d.board || {};
      document.getElementById("pIntro").textContent = b.intro || "";
      document.getElementById("people").innerHTML = (b.members || []).map(function (m) {
        return '<div class="person">' + portrait(m) +
          '<div class="who"><b>' + esc(m.name) + "</b>" +
          '<span class="role">' + esc(m.role || "") + "</span>" +
          (m.relation || m.qualification
            ? '<small class="meta">' + esc([m.relation, m.qualification].filter(Boolean).join(" · ")) + "</small>"
            : "") +
          (m.bio ? "<p>" + esc(m.bio) + "</p>" : "") +
          "</div></div>";
      }).join("");
      CKB_aboutNav("board.html");
      CKB_reveals();
    });
  })();
  </script>
</body>
</html>
