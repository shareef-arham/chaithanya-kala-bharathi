<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Films &amp; Reports — CKB</title>
  <meta name="description" content="Films and reports from Chaithanya Kala Bharathi's work across Kurnool and Nandyal districts — education, health, nutrition and livelihoods." />
  <link rel="icon" href="assets/logo-sm.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=31" />
</head>
<body data-page="gallery">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Home</a> / <span>Gallery</span></div>
        <span class="eyebrow">Films &amp; reports</span>
        <h1>Gallery</h1>
        <p class="lede" style="margin-top:.7rem" id="gIntro"></p>
      </div>
    </section>

    <section style="padding-top:1rem">
      <div class="wrap">
        <div id="film" data-reveal></div>
        <div class="video-grid" id="moments" data-reveal></div>
        <nav class="pager" id="pager" aria-label="Gallery pages" hidden></nav>
        <p class="lede center" id="momentsEmpty" style="margin:1.6rem auto 0;display:none">
          Nothing added yet. Films and reports can be added from the admin panel, under <b>Gallery</b>.
        </p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <div class="lightbox" id="lightbox">
    <button class="close" id="lbClose" aria-label="Close">&times;</button>
    <div class="frame" id="lbFrame"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="assets/js/site.js?v=14"></script>
  <script>
  (function () {
    var esc = window.CKB_esc;
    var PLAY = '<span class="pin"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>';

    function ytThumb(id) { return "https://i.ytimg.com/vi/" + encodeURIComponent(id) + "/hqdefault.jpg"; }

    /* ---- lightbox for YouTube playback ---- */
    var lb = document.getElementById("lightbox"), lbFrame = document.getElementById("lbFrame");
    function openVideo(id) {
      if (!id) return;
      lbFrame.innerHTML = '<iframe src="https://www.youtube.com/embed/' + encodeURIComponent(id) +
        '?autoplay=1&rel=0" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
      lb.classList.add("open");
    }
    function closeVideo() { lb.classList.remove("open"); lbFrame.innerHTML = ""; }
    document.getElementById("lbClose").addEventListener("click", closeVideo);
    lb.addEventListener("click", function (e) { if (e.target === lb) closeVideo(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeVideo(); });
    document.addEventListener("click", function (e) {
      var el = e.target.closest("[data-video]");
      if (el && el.dataset.video) { e.preventDefault(); openVideo(el.dataset.video); }
    });

    function ytId(s) {
      s = String(s || "").trim();
      var m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
      if (m) return m[1];
      return /^[A-Za-z0-9_-]{11}$/.test(s) ? s : "";
    }

    /* A programme's film that names its report (Admin → Programs → Films → "Its
       report") also appears here as one card with both. A film without a report,
       a report without a film, and annual reports stay on the Programs page only;
       anything the Gallery already shows is not repeated. These cards go above the
       Gallery's own list, newest month first. */
    function fromPrograms(P, d) {
      var seen = {}, out = [];
      function mark(k) { if (k) seen[String(k).toLowerCase()] = 1; }
      function has(k) { return k && seen[String(k).toLowerCase()]; }
      mark(d.featured && d.featured.videoId);
      (d.moments || []).forEach(function (m) { mark(m.file); (m.videos || []).forEach(mark); });
      (P.items || []).forEach(function (it) {
        var reps = (it.reports || []).slice();
        if (it.file) reps.push({ file: it.file, title: it.title });
        (it.videos || []).forEach(function (v) {
          var id = ytId(v.yt), r = v.report && reps.filter(function (x) { return x.file === v.report; })[0];
          if (!id || !r || /annual report/i.test(r.title || "") || has(id) || has(r.file)) return;
          mark(id); mark(r.file);
          out.push({ title: r.title || v.title, when: r.when || it.title, blurb: v.note || "", videos: [id], file: r.file, date: v.date || "" });
        });
      });
      return out.map(function (m, i) { return { m: m, i: i }; }).sort(function (a, b) {
        var da = a.m.date || "", db = b.m.date || "";
        if (da !== db) return !da ? 1 : !db ? -1 : da < db ? 1 : -1;
        return a.i - b.i;
      }).map(function (o) { return o.m; });
    }

    Promise.all([CKB_get("gallery.json"), CKB_get("programs.json")]).then(function (res) {
      var d = res[0] || {};
      document.getElementById("gIntro").textContent = d.intro || "";

      /* featured film — only shown once a video ID has been added */
      var f = d.featured || {};
      document.getElementById("film").innerHTML = f.videoId
        ? '<div class="film">' +
            '<div class="thumb" role="button" tabindex="0" data-video="' + esc(f.videoId) +
            '" style="background-image:url(' + esc(f.thumb || ytThumb(f.videoId)) + ')">' + PLAY + "</div>" +
            '<div class="body"><span class="eyebrow">' + esc(f.eyebrow || "Featured film") + "</span>" +
            "<h2>" + esc(f.title || "") + "</h2><p>" + esc(f.desc || "") + "</p></div>" +
          "</div>"
        : "";

      /* Cards appear in the order the admin lists them. New ones are added at
         the top there, so the page reads newest first without needing a date
         on every entry — most of the older ones have none. */
      var moments = fromPrograms(res[1] || {}, d).concat(d.moments || []);

      /* Twelve to a page. The page number lives in the address (#page=2), so
         Back, Forward and a shared link all land on the same page. */
      var PER_PAGE = 12;
      var pages = Math.max(1, Math.ceil(moments.length / PER_PAGE));
      var grid = document.getElementById("moments"), pager = document.getElementById("pager");
      var filmBox = document.getElementById("film"), filmHTML = filmBox.innerHTML;

      function card(m) {
        var vids = m.videos || [];
        var v0 = vids[0] || "";
        var actions = vids.map(function (v, i) {
          return '<button class="mini-btn" data-video="' + esc(v) + '">&#9654; ' +
            (vids.length > 1 ? "Film " + (i + 1) : "Watch film") + "</button>";
        }).join("");
        if (m.file) {
          actions += '<button class="mini-btn ghost" data-doc="' + esc(m.file) +
            '" data-title="' + esc(m.title) + '" data-sub="' + esc(m.when || "") + '">&#128196; Report</button>';
        }
        var thumb = v0
          ? '<div class="video-thumb" style="background-image:url(' + esc(ytThumb(v0)) +
            ')" role="button" tabindex="0" data-video="' + esc(v0) + '">' + PLAY + "</div>"
          : m.file
            ? '<div class="video-thumb no-video" role="button" tabindex="0" data-doc="' + esc(m.file) +
              '" data-title="' + esc(m.title) + '" data-sub="' + esc(m.when || "") + '">' +
              '<span class="pdf-cover" data-cover="' + esc(m.file) + '"><span class="fb">📄</span><canvas></canvas></span></div>'
            : '<div class="video-thumb no-video"><span class="doc-glyph">📄</span></div>';
        return '<div class="video-card">' + thumb +
          '<div class="meta">' +
            (m.when ? '<div class="cat">' + esc(m.when) + "</div>" : "") +
            "<h3>" + esc(m.title || "") + "</h3>" +
            "<small>" + esc(m.blurb || "") + "</small>" +
            '<div class="mini-actions">' + actions + "</div>" +
          "</div></div>";
      }

      function currentPage() {
        var m = /page=(\d+)/.exec(location.hash);
        return Math.min(pages, Math.max(1, m ? +m[1] : 1));
      }
      function pagerHTML(n) {
        if (pages < 2) return "";
        var btn = function (p, label, cls, aria) {
          var off = p < 1 || p > pages;
          return '<a class="pg' + (cls ? " " + cls : "") + (off ? " off" : "") + '"' + (off ? ' aria-disabled="true"' : ' href="#page=' + p + '"') +
            (aria ? ' aria-label="' + aria + '"' : "") + (p === n && !cls ? ' aria-current="page"' : "") + ">" + label + "</a>";
        };
        var out = btn(n - 1, "&lsaquo; Previous", "step", "Previous page");
        for (var p = 1; p <= pages; p++) out += btn(p, String(p), "", "Page " + p);
        return out + btn(n + 1, "Next &rsaquo;", "step", "Next page");
      }
      function show(scroll) {
        var n = currentPage();
        filmBox.innerHTML = n === 1 ? filmHTML : "";
        grid.innerHTML = moments.slice((n - 1) * PER_PAGE, n * PER_PAGE).map(card).join("");
        pager.innerHTML = pagerHTML(n);
        pager.hidden = pages < 2;
        if (window.CKB_renderCovers) window.CKB_renderCovers("#moments");
        if (scroll) (n === 1 ? filmBox : grid).scrollIntoView({ behavior: "smooth", block: "start" });
      }
      window.addEventListener("hashchange", function () { show(true); });
      show(false);

      document.getElementById("momentsEmpty").style.display = moments.length ? "none" : "";
      CKB_reveals();
    });
  })();
  </script>
</body>
</html>
