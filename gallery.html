<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — CKB</title>
  <meta name="description" content="Photographs and field records from Chaithanya Kala Bharathi's work in Kurnool and Nandyal districts." />
  <link rel="icon" href="assets/logo-sm.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=1" />
</head>
<body data-page="gallery">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Home</a> / <span>Gallery</span></div>
        <span class="eyebrow">From the field</span>
        <h1>Gallery</h1>
        <p class="lede" style="margin-top:.7rem" id="gIntro"></p>
      </div>
    </section>
    <section style="padding-top:1.4rem">
      <div class="wrap">
        <div class="grid grid-3" id="photos" data-reveal></div>
          <div class="card" style="padding:0;overflow:hidden"><img src="uploads/programs-community.jpg" alt="Community welfare work" style="height:230px;width:100%;object-fit:cover" /></div>
          <div class="card" style="padding:0;overflow:hidden"><img src="uploads/gallery-volunteer.jpg" alt="Volunteers in the field" style="height:230px;width:100%;object-fit:cover" /></div>
        </div>
        <div id="galleryDoc" style="margin-top:2rem;max-width:480px" data-reveal></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/site.js?v=1"></script>
  <script>
  (function(){
    var esc = window.CKB_esc;
    Promise.all([CKB_get("reports.json"), CKB_get("gallery.json")]).then(function(res){
      var r = res[0] || {}, g2 = res[1] || {};
      document.getElementById("gIntro").textContent = g2.intro || "";
      document.getElementById("photos").innerHTML = (g2.photos || []).map(function(ph){
        return '<figure class="card" style="padding:0;overflow:hidden">' +
          '<img src="' + esc(ph.file) + '" alt="' + esc(ph.caption || "") + '" style="height:230px;width:100%;object-fit:cover" />' +
          (ph.caption ? '<figcaption style="padding:.7rem .9rem;font-size:.88rem;color:var(--ink-soft)">' + esc(ph.caption) + '</figcaption>' : "") +
          '</figure>';
      }).join("");
      var g = (r && r.gallery) || {};
      if (g.file) {
        document.getElementById("galleryDoc").innerHTML =
          '<div class="card" role="button" tabindex="0" data-doc="' + esc(g.file) +
          '" data-title="' + esc(g.title) + '" data-sub="' + esc(g.sub || "") + '">' +
          '<div class="ico">🖼️</div><h3>' + esc(g.title) + '</h3>' +
          '<div class="sub">' + esc(g.sub || "") + '</div>' +
          '<span class="open">Open the photo gallery &rarr;</span></div>';
      }
      CKB_reveals();
    });
  })();
  </script>
</body>
</html>
