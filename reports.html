<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports &amp; Audited Accounts — CKB</title>
  <meta name="description" content="Chaithanya Kala Bharathi's Annual Reports and independently audited statements of accounts — opened right here on the page." />
  <link rel="icon" href="assets/logo-sm.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=30" />
</head>
<body data-page="reports">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Home</a> / <span>Reports</span></div>
        <span class="eyebrow">Transparency</span>
        <h1>Accountable, in the open</h1>
        <p class="lede" style="margin-top:.7rem" id="gIntro"></p>
      </div>
    </section>

    <section style="padding-top:.6rem">
      <div class="wrap">
        <div class="rep-strip" id="repStats" data-reveal></div>

        <!-- 1. the latest year, in the spotlight -->
        <div id="repSpot" data-reveal></div>

        <!-- 2. every year as a volume on the shelf -->
        <div class="rep-head" data-reveal>
          <div><span class="eyebrow">The archive</span><h2>Every year, <em style="color:var(--green)">on the record</em></h2></div>
          <small id="repCount"></small>
        </div>
        <div class="rep-shelf" id="repShelf" data-reveal></div>
        <p class="lede center" id="rtlEmpty" style="margin:1.6rem auto 0;display:none">
          No annual reports have been added yet. They can be uploaded from the
          admin panel, under <b>Reports</b>.
        </p>

        <div id="mediaRow" class="center" style="margin:3rem auto 0;max-width:460px" data-reveal></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="assets/js/site.js?v=13"></script>
  <script>
  (function () {
    var esc = window.CKB_esc;

    CKB_get("governance.json")
      .then(function (g) {
        g = g || {};
        var ars = g.annualReports || [], auds = g.auditedAccounts || [];

        document.getElementById("gIntro").textContent = g.intro || "";

        /* pair each annual report with the audited statement for its year;
           a year that has only a statement still gets its volume */
        var byYear = {}, years = [];
        function slot(y) { if (!byYear[y]) { byYear[y] = {}; years.push(y); } return byYear[y]; }
        ars.forEach(function (a) { if (a && a.year) slot(a.year).ar = a; });
        auds.forEach(function (a) { if (a && a.year) slot(a.year).au = a; });
        years.sort(function (a, b) { return a < b ? 1 : a > b ? -1 : 0; });   /* newest first */

        var first = years.length ? years[years.length - 1] : "";
        document.getElementById("repStats").innerHTML =
          "<div><b>" + years.length + "</b><span>Years published</span></div>" +
          "<div><b>" + (ars.length + auds.length) + "</b><span>Public documents</span></div>" +
          "<div><b>" + esc(String(first).split("-")[0] || "1992") + "</b><span>Archive since</span></div>" +
          "<div><b>80G</b><span>Tax-deductible gifts</span></div>";

        function yr(y) { return esc(String(y || "").replace("-", "\u2013")); }
        function cover(x, glyph) {
          if (!x || !x.file) return "";
          return '<span class="pdf-cover" role="button" tabindex="0" data-doc="' + esc(x.file) + '" data-title="' + esc(x.title) +
            '" data-sub="' + esc(x.sub || "") + '" title="' + esc(x.title) + '" data-cover="' + esc(x.file) + '"><span class="fb">' +
            glyph + "</span><canvas></canvas></span>";
        }
        function link(x, label) {
          return x && x.file
            ? '<span class="vol-link" role="button" tabindex="0" data-doc="' + esc(x.file) + '" data-title="' + esc(x.title) +
              '" data-sub="' + esc(x.sub || "") + '">' + label + " <i>&rarr;</i></span>"
            : '<span class="vol-link na">' + label + " \u2014 not yet published</span>";
        }

        /* the spotlight: the year marked Latest in admin, else the newest */
        var latestYear = (ars.filter(function (a) { return a.latest; })[0] || {}).year || years[0];
        var L = byYear[latestYear] || {};
        document.getElementById("repSpot").innerHTML = latestYear
          ? '<div class="rep-spot"><div class="rep-spot-covers">' + cover(L.ar, "📘") + cover(L.au, "🧮") + "</div>" +
            '<div><span class="eyebrow">Latest publication</span>' +
            '<h2>The year <span class="yr">' + yr(latestYear) + "</span></h2>" +
            "<p>" + esc((L.ar && L.ar.sub) || "Programmes, reach and activities") +
            (L.au ? ", with the independently audited statement of accounts for the same year." : ".") + "</p>" +
            '<div class="rep-spot-acts">' +
              (L.ar ? '<span class="btn btn-green" role="button" tabindex="0" data-doc="' + esc(L.ar.file) + '" data-title="' + esc(L.ar.title) + '">Read the annual report</span>' : "") +
              (L.au ? '<span class="btn btn-ghost" role="button" tabindex="0" data-doc="' + esc(L.au.file) + '" data-title="' + esc(L.au.title) + '">Audited statement</span>' : "") +
            "</div></div></div>"
          : "";

        /* the shelf: every year, newest first */
        document.getElementById("repShelf").innerHTML = years.map(function (y) {
          var e = byYear[y];
          return '<article class="vol"><div class="vol-covers">' + cover(e.ar, "📘") + cover(e.au, "🧮") + "</div>" +
            '<div class="vol-year">' + yr(y) + "<small>" + (y === latestYear ? "Latest" : "Financial year") + "</small></div>" +
            '<div class="vol-links">' + link(e.ar, "Annual report") + link(e.au, "Audited statement") + "</div></article>";
        }).join("");
        document.getElementById("repCount").textContent = years.length ? years.length + " years \u00b7 newest first" : "";
        document.getElementById("rtlEmpty").style.display = years.length ? "none" : "";

        var m = g.media || {};
        document.getElementById("mediaRow").innerHTML = m.file
          ? '<div class="doc-card" role="button" tabindex="0" data-doc="' + esc(m.file) +
            '" data-title="' + esc(m.title) + '" data-sub="' + esc(m.sub || "") + '">' +
            '<span class="pdf-cover" data-cover="' + esc(m.file) + '"><span class="fb">📰</span><canvas></canvas></span>' +
            "<b>" + esc(m.title) + "</b><small>" + esc(m.sub || "") + "</small>" +
            '<span class="open">Open &rarr;</span></div>'
          : "";

        CKB_reveals();
        if (window.CKB_renderCovers) window.CKB_renderCovers("main");
      });
  })();
  </script>
</body>
</html>
