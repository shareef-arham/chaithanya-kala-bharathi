<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision & Mission — CKB</title>
  <meta name="description" content="The vision, mission, goal and objectives of Chaithanya Kala Bharathi." />
  <link rel="icon" href="assets/logo-sm.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=11" />
</head>
<body data-page="about">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Home</a> / <a href="about.html">About Us</a> / <span>Vision & Mission</span></div>
        <span class="eyebrow">Vision &amp; Mission</span>
        <h1>What we set out to do</h1>
        <p class="lede" style="margin-top:.7rem" id="pIntro"></p>
      </div>
    </section>

    <section style="padding-top:1.4rem">
      <div class="wrap">
        <div class="vm-pair" id="vmPair" data-reveal></div>
        <div class="vm-goal" id="vmGoal" data-reveal></div>

        <div id="vmObjWrap" data-reveal>
          <h3 class="vm-h">Objectives</h3>
          <ol class="vm-obj" id="vmObj"></ol>
        </div>

      </div>
    </section>

    <section style="padding-top:0">
      <div class="wrap">
        <div class="about-nav" id="aboutNav" data-reveal></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/site.js?v=11"></script>
  <script>
  (function () {
    var esc = window.CKB_esc;
    CKB_get("vision.json").then(function (vm) {
      document.getElementById("pIntro").textContent = vm.intro || "";
      document.getElementById("vmPair").innerHTML =
        (vm.vision  ? '<div class="vm-card"><span class="eyebrow">Vision</span><p>'  + esc(vm.vision)  + "</p></div>" : "") +
        (vm.mission ? '<div class="vm-card alt"><span class="eyebrow">Mission</span><p>' + esc(vm.mission) + "</p></div>" : "");
      document.getElementById("vmGoal").innerHTML = vm.goal
        ? '<span class="eyebrow">Goal</span><p>' + esc(vm.goal) + "</p>" : "";
      var objs = vm.objectives || [];
      document.getElementById("vmObjWrap").style.display = objs.length ? "" : "none";
      document.getElementById("vmObj").innerHTML = objs.map(function (o) {
        return "<li>" + esc(o) + "</li>";
      }).join("");
      CKB_aboutNav("vision.html");
      CKB_reveals();
    });
  })();
  </script>
</body>
</html>
